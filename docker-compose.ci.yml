# CI stack: backend only, with the repo's ./test_images mounted read-only as a
# library. Separate volume so CI never touches a local `tagify_data`.
services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: tagify-backend-ci
    restart: "no"
    volumes:
      - ./test_images:/data/test_images:ro
      - tagify_data_ci:/data
    environment:
      SQLITE_PATH: /data/tagify.db
      THUMB_ROOT: /data/thumbs
      MODEL_CACHE_DIR: /data/models
      LOG_TO_FILE: "false"
      THUMB_MAX_SIZE: ${THUMB_MAX_SIZE:-1080}
      SCANNER_MAX_WORKERS: ${SCANNER_MAX_WORKERS:-0}
      # CI adds a library and waits for one scan; no watcher needed.
      WATCH_ENABLED_DEFAULT: "false"
    ports:
      - "${TAGIFY_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  tagify_data_ci:
